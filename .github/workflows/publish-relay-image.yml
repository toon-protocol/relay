name: Publish relay image

# Builds the relay image (crates/relay/Dockerfile, the Rust relay of spec #185)
# and pushes it to GHCR. Since the cutover (#205) this is the image every stack
# receives, and the only relay image built from this repo (the TypeScript relay
# was removed in #206; deploy/rust-workspace.test.ts fails the build if it
# comes back).
#
#   release                moves on every publish from main; what a stack follows
#   latest                 moves with it
#   rust-<handle>          immutable release handle, YYYY.MM.DD.N (UTC date and
#                          that day's ordinal), the connector's scheme
#   rust-sha-<short sha>   immutable per-commit tag
#
# `release` is this image's instance of the fleet-wide moving-tag convention
# (first landed in swap#131): a box follows `:release` rather than `:latest`,
# so an auto-redeploy only ever follows a commit that landed on main and built
# here. Both move only from main; a run dispatched on another branch writes
# the two immutable tags and nothing a stack follows.
#
# The immutable tags keep the `rust-` prefix the candidate was soaked under
# (#202), the connector's convention for its own Rust image. Nothing here
# writes an unprefixed `sha-*` tag: those are the TypeScript builds, and the
# last of them is the rollback target deploy/README.md names. `rust-candidate`
# is no longer moved; it stays on the last build before the cutover.
#
# The handle is also the version the image reports on /health and in the Relay
# Information Document (the crate stays at 0.1.0 and is not published).
#
# Every tag names one index of two images, linux/amd64 and linux/arm64, built
# from the same commit with the same handle, each on a native runner. It
# publishes only after the conformance suite has passed against this commit's
# amd64 image and each image has been started and its /health checked, so
# `:release` is always a build the suite accepted. Tags published before the
# arm64 image existed stay amd64 only.
#
# Do not re-run a run of this workflow from before #205: a re-run uses the
# workflow file of its own commit, which builds the TypeScript image and
# pushes it over `:release` and `:latest`.

on:
  push:
    branches: [main]
  workflow_dispatch:

# One group for every ref, not one per ref: two runs choosing a handle at the
# same time would choose the same one.
concurrency: publish-relay-image

permissions:
  contents: read

jobs:
  # The handle is the UTC date plus the next free ordinal for that date,
  # read from the tags already on the package, so a second publish the same
  # day is `.2` and nothing ever reuses one. Only a package with no versions
  # yet (404) reads as none taken: any other failure stops the publish rather
  # than fall back to `.1` and overwrite an immutable handle.
  handle:
    name: Choose the release handle
    runs-on: ubuntu-latest
    # Reads the tags already on the package.
    permissions:
      packages: read
    outputs:
      handle: ${{ steps.handle.outputs.handle }}
    steps:
      - name: Choose the release handle
        id: handle
        env:
          GH_TOKEN: ${{ github.token }}
          OWNER: ${{ github.repository_owner }}
        run: |
          set -euo pipefail
          DATE=$(date -u +%Y.%m.%d)
          if ! TAGS=$(gh api --paginate "/orgs/$OWNER/packages/container/relay/versions" \
                        --jq '.[].metadata.container.tags[]' 2>err); then
            grep -q 'HTTP 404' err || { cat err >&2; exit 1; }
            TAGS=
          fi
          TAKEN=$(printf '%s\n' "$TAGS" \
                  | grep -E "^rust-${DATE//./\\.}\.[0-9]+\$" \
                  | sed -E 's/.*\.([0-9]+)$/\1/' | sort -n | tail -1 || true)
          HANDLE="$DATE.$(( ${TAKEN:-0} + 1 ))"
          echo "handle=$HANDLE"
          echo "handle=$HANDLE" >> "$GITHUB_OUTPUT"

  # The suite runs against the image built with the handle, and that build
  # fills the cache the amd64 `publish` build reads, so what is pushed is the build the
  # suite accepted, reporting the version it is tagged with.
  conformance:
    name: Conformance suite against the image
    needs: handle
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 8.15.9

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - uses: docker/setup-buildx-action@v3

      - name: Build the image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: crates/relay/Dockerfile
          push: false
          load: true
          tags: relay:conformance
          build-args: |
            TOON_RELEASE_HANDLE=${{ needs.handle.outputs.handle }}
          cache-from: type=gha,scope=relay-rust-amd64
          cache-to: type=gha,mode=max,scope=relay-rust-amd64

      - name: Run the suite against the image
        env:
          CONFORMANCE_IMAGE: relay:conformance
          CONFORMANCE_IMPL: rust
          CONFORMANCE_COMMAND: relay
        run: pnpm --filter @toon-protocol/relay-conformance conformance

  # One image per platform, each built on a native runner (the arm64 one is
  # the runner the binary job uses) so nothing compiles Rust under QEMU. Each
  # is started and its /health checked, reporting the handle, before it is
  # pushed. It is pushed by digest, with no tag: a digest nothing names moves
  # nothing a stack follows, and `index` below is the only job that tags.
  publish:
    name: Push the ${{ matrix.platform }} image
    needs: [handle, conformance]
    runs-on: ${{ matrix.runner }}
    # The only jobs that can write to the registry (with `index`).
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: true
      matrix:
        include:
          - platform: linux/amd64
            arch: amd64
            runner: ubuntu-latest
          - platform: linux/arm64
            arch: arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build the image to start it
        uses: docker/build-push-action@v6
        with:
          context: .
          file: crates/relay/Dockerfile
          platforms: ${{ matrix.platform }}
          push: false
          load: true
          tags: relay:smoke
          build-args: |
            TOON_RELEASE_HANDLE=${{ needs.handle.outputs.handle }}
          cache-from: type=gha,scope=relay-rust-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=relay-rust-${{ matrix.arch }}

      # The runner is native, so this is the image running as a stack runs it.
      - name: Start the image and check /health
        env:
          HANDLE: ${{ needs.handle.outputs.handle }}
        run: |
          set -euo pipefail
          docker run -d --name relay-smoke -p 3100:3100 relay:smoke
          for _ in $(seq 1 30); do
            if BODY=$(curl -fsS http://127.0.0.1:3100/health); then
              echo "$BODY"
              if ! grep -q "\"$HANDLE\"" <<<"$BODY"; then
                echo "/health does not report the handle $HANDLE" >&2
                exit 1
              fi
              exit 0
            fi
            sleep 1
          done
          docker logs relay-smoke >&2
          echo "/health did not answer" >&2
          exit 1

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Built from the cache the step above filled: the image pushed is the
      # one just started. No provenance, so the digest is a plain image and
      # the index below lists exactly two platforms.
      - name: Push the image by digest
        id: push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: crates/relay/Dockerfile
          platforms: ${{ matrix.platform }}
          provenance: false
          outputs: type=image,name=ghcr.io/${{ github.repository_owner }}/relay,push-by-digest=true,name-canonical=true,push=true
          build-args: |
            TOON_RELEASE_HANDLE=${{ needs.handle.outputs.handle }}
          cache-from: type=gha,scope=relay-rust-${{ matrix.arch }}

      - name: Export the digest
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          mkdir -p digests
          touch "digests/${DIGEST#sha256:}"

      - uses: actions/upload-artifact@v4
        with:
          name: digests-${{ matrix.arch }}
          path: digests/*
          if-no-files-found: error

  # Joins the two digests into one index and names it with every tag, so all
  # four tags of a publish are the same index digest. The tags and the moment
  # they are pushed are unchanged: after the suite, and `release` and `latest`
  # from main only.
  index:
    name: Tag the two-platform index
    needs: [handle, publish]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: digests-*
          path: digests
          merge-multiple: true

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Derive tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/relay
          flavor: latest=false
          tags: |
            type=raw,value=release,enable={{is_default_branch}}
            type=raw,value=latest,enable={{is_default_branch}}
            type=raw,value=rust-${{ needs.handle.outputs.handle }}
            type=sha,prefix=rust-sha-

      - name: Create the index
        env:
          IMAGE: ghcr.io/${{ github.repository_owner }}/relay
        working-directory: digests
        run: |
          set -euo pipefail
          test "$(ls | wc -l)" -eq 2
          TAGS=$(jq -cr '.tags | map("-t " + .) | join(" ")' <<<"$DOCKER_METADATA_OUTPUT_JSON")
          # shellcheck disable=SC2046,SC2086
          docker buildx imagetools create $TAGS $(printf "$IMAGE@sha256:%s " *)

      - name: Inspect the index
        env:
          TAG: rust-${{ needs.handle.outputs.handle }}
        run: |
          set -euo pipefail
          docker buildx imagetools inspect "ghcr.io/${{ github.repository_owner }}/relay:$TAG"

  # The same relay as a bare binary (#217), for a host with no container
  # runtime: static musl, one per architecture, each on a native runner so
  # nothing is emulated. The handle is built in, as in the image, so the binary
  # reports the version its release is named with. Built with cargo rather than
  # out of the Dockerfile: it is the same crate, the same lockfile and the same
  # musl target the image's Alpine stage builds for.
  binary:
    name: Build the ${{ matrix.arch }} binary
    needs: [handle, conformance]
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: true
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-latest
            target: x86_64-unknown-linux-musl
          - arch: aarch64
            runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
    steps:
      - uses: actions/checkout@v4

      # No version here: rustup reads rust-toolchain.toml, the one pin.
      - name: Install the pinned toolchain
        run: rustup toolchain install

      - name: Install the musl toolchain
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends musl-tools
          rustup target add "${{ matrix.target }}"

      - name: Build
        env:
          TOON_RELEASE_HANDLE: ${{ needs.handle.outputs.handle }}
          CC: musl-gcc
        run: cargo build --release --locked -p relay --target "${{ matrix.target }}"

      - name: Package
        run: |
          set -euo pipefail
          NAME="relay-linux-${{ matrix.arch }}"
          mkdir dist
          cp "target/${{ matrix.target }}/release/relay" "dist/$NAME"
          # A static binary has no interpreter; this fails the build if the
          # musl link quietly became a dynamic one. (Not `! readelf …`: set -e
          # ignores a negated command, so that line could never fail.)
          if readelf -l "dist/$NAME" | grep -q INTERP; then
            echo "dist/$NAME is dynamically linked" >&2
            exit 1
          fi
          # And it runs as a bare binary, outside the image.
          "dist/$NAME" --help > /dev/null
          (cd dist && sha256sum "$NAME" > "$NAME.sha256")

      - uses: actions/upload-artifact@v4
        with:
          name: relay-linux-${{ matrix.arch }}
          path: dist/*
          if-no-files-found: error

  # One GitHub release per publish from main, tagged rust-<handle> like the
  # image, carrying both binaries and one SHA256SUMS file over them. A run on
  # another branch builds the binaries and releases nothing. It waits for the
  # image: the handle is chosen from the package's tags, so a release made
  # before its image was pushed could have its handle chosen again.
  release:
    name: Attach the binaries to a release
    needs: [handle, binary, index]
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # The binaries only: the image build also leaves its build records
      # (*.dockerbuild) among the run's artifacts, which do not extract here.
      - uses: actions/download-artifact@v4
        with:
          pattern: relay-linux-*
          path: dist
          merge-multiple: true

      - name: Write SHA256SUMS
        working-directory: dist
        run: |
          set -euo pipefail
          cat relay-linux-*.sha256 > SHA256SUMS
          sha256sum --check SHA256SUMS

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: rust-${{ needs.handle.outputs.handle }}
        # Re-runnable: a release an earlier attempt created is reused and its
        # assets overwritten with this run's build of the same commit.
        run: |
          set -euo pipefail
          if ! gh release view "$TAG" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            gh release create "$TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" \
              --title "Relay $TAG" \
              --notes "The relay binary for Linux x86_64 and aarch64 (static, musl), the build behind ghcr.io/toon-protocol/relay:$TAG. Verify with \`sha256sum --check SHA256SUMS\`; see the README."
          fi
          gh release upload "$TAG" dist/relay-linux-x86_64 dist/relay-linux-aarch64 dist/SHA256SUMS \
            --repo "$GITHUB_REPOSITORY" \
            --clobber
