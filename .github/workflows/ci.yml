name: CI

on:
  # The no-op merge guard's triggers (#180): the defaults plus
  # `ready_for_review`. `synchronize` catches a PR that BECOMES a no-op.
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]

jobs:
  # `release.yml`'s `changesets/action` runs `pnpm changeset version` AFTER
  # merge to main, where a failure gates nothing and reads like any other
  # post-merge red (#140). Until this job there was no changeset job in
  # `ci.yml` at all, so an invalid release plan (a changeset naming a package
  # not in the workspace, a misspelled version keyword, or one mixing an
  # `ignore`d package with a non-ignored one, which changesets refuses
  # outright) stayed invisible until `release.yml` read it post-merge. That is
  # exactly what happened in toon-client#611, whose changeset job asserted only
  # that a `.changeset/*.md` file EXISTS and never parsed one: release.yml went
  # red on every push to main for a day, hiding five stacked offending
  # changesets behind the first error `changeset version` stopped at.
  #
  # This job runs the byte-identical command to release.yml's `version:`
  # input, so green here means the release actually gets past versioning --
  # no second implementation of "is this a valid plan" to drift out of sync.
  # Deliberately NOT `changeset status`: it additionally resolves
  # `baseBranch` through git and fails when IT decides packages changed with
  # no changeset, which is a different (and heavier) assertion this repo
  # hasn't asked for. Mutating the tree costs nothing -- this is a throwaway
  # checkout that commits, pushes and publishes nothing -- so the resulting
  # diff is printed rather than discarded.
  changeset:
    name: Changeset
    runs-on: ubuntu-latest
    # release.yml itself runs on push-to-main, i.e. after merge -- by then
    # there is nothing left to gate, so this only needs to run pre-merge.
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
        with:
          version: 8.15.9

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Assert the changesets form a valid release plan
        run: |
          set -euo pipefail
          pnpm changeset version
          echo "--- the release plan this PR would produce ---"
          git --no-pager diff --stat
          echo "✅ changeset version succeeds — release.yml can get past versioning"

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 8.15.9

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Start gate timer
        id: gate-timer
        run: echo "start=$(date +%s)" >> "$GITHUB_OUTPUT"

      - name: Cache ESLint
        uses: actions/cache@v4
        with:
          path: .eslintcache
          key: eslint-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml', 'eslint.config.js') }}
          restore-keys: |
            eslint-${{ runner.os }}-

      - name: Lint (frozen correctness baseline)
        run: |
          set -euo pipefail
          BASELINE_WARNINGS=$(jq -r '.correctness.eslintWarnings' .sandcastle/gate-baseline.json)
          echo "Failing on any eslint error, or more than the frozen $BASELINE_WARNINGS warnings."
          pnpm exec eslint . --cache --cache-location .eslintcache --max-warnings "$BASELINE_WARNINGS"

      - run: pnpm -r build

      - run: pnpm typecheck

      - run: pnpm -r test --if-present

      - name: Gate speed no-regression guard
        run: |
          set -euo pipefail
          END=$(date +%s)
          ELAPSED=$((END - ${{ steps.gate-timer.outputs.start }}))
          BASELINE_SECONDS=$(jq -r '.speed.gateWallClockSeconds' .sandcastle/gate-baseline.json)
          TOLERANCE=$(jq -r '.regressionTolerancePercent' .sandcastle/gate-baseline.json)
          LIMIT=$((BASELINE_SECONDS + BASELINE_SECONDS * TOLERANCE / 100))
          echo "Gate took ${ELAPSED}s (frozen baseline ${BASELINE_SECONDS}s, +${TOLERANCE}% limit ${LIMIT}s)"
          if [ "$ELAPSED" -gt "$LIMIT" ]; then
            echo "::error::Gate speed regressed vs .sandcastle/gate-baseline.json: ${ELAPSED}s > ${LIMIT}s"
            exit 1
          fi

  devbox-validate:
    name: Devbox Environment Validation
    runs-on: ubuntu-latest
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install devbox
        uses: jetify-com/devbox-install-action@v0.15.0
        with:
          enable-cache: true

      - name: Assert tool versions
        run: |
          cat > "${RUNNER_TEMP:-/tmp}/assert-versions.sh" <<'ASSERT'
          set -euo pipefail
          node --version | grep -E '^v22\.'
          pnpm --version | grep -E '^8\.15\.'
          # rustup is the devbox package; the toolchain it resolves is
          # rust-toolchain.toml's pin, never a version named here.
          PINNED=$(sed -n 's/^channel = "\(.*\)"$/\1/p' rust-toolchain.toml)
          [ -n "$PINNED" ]
          cargo --version | grep -F "cargo $PINNED "
          rustc --version | grep -F "rustc $PINNED "
          ASSERT
          devbox run -- bash "${RUNNER_TEMP:-/tmp}/assert-versions.sh"
          echo "✅ All devbox tools resolved at expected versions"

      - name: Smoke build
        run: devbox run -- bash -c "pnpm install --frozen-lockfile && pnpm build"

  # The gate for the Cargo workspace (#192): the Rust relay being built beside
  # the TypeScript package (#185). The four cargo commands are the connector's
  # own gate, in its order (docs/rust-coding-standards.md), and they are also
  # what the factory runs before it opens a PR (.sandcastle/run-gate.ts);
  # deploy/factory-gate.test.ts fails the build if the two drift.
  #
  # Deliberately NOT part of the `build` job, whose wall clock is measured
  # against a frozen baseline that knows nothing of a cargo build.
  rust-gate:
    name: Rust workspace gate
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Cache the cargo registry and the workspace target
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: rust-gate-${{ runner.os }}-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock') }}
          restore-keys: |
            rust-gate-${{ runner.os }}-

      # No version here: rustup reads rust-toolchain.toml, the one pin.
      - name: Install the pinned toolchain
        run: rustup toolchain install

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Build workspace
        run: cargo build --workspace

      - name: Run tests
        run: cargo test --workspace

      - name: Clippy (warnings denied)
        run: cargo clippy --workspace --all-targets -- -D warnings

  # No-op merge guard: a PR whose merge result changes zero files must not
  # merge green. connector#1008 merged green, closed its ticket and changed
  # zero files -- and a human merged it, because a red NON-required check is
  # only a warning on the merge button. So this job feeds `ci-ok` below, the
  # one required check, which asserts on its result. (It used to be a call to
  # toon-meta's reusable empty-pr-guard.yml; it lives here now, and the logic
  # is .github/scripts/no-op-merge-guard.sh, exercised by
  # deploy/no-op-merge-guard.test.ts.)
  #
  # No `if:`: this workflow also runs on push, where the guard passes with a
  # plain "no merge result to evaluate"; a job-level `if:` would make it
  # `skipped` there, and a skipped gating job must never read as a pass. The
  # job id must not be one of the fleet's plumbing names (`guard`, `review`,
  # ...), which are stripped from the factory's check verdict.
  no-op-merge:
    name: No-op merge guard
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      # The guard reads only the merge commit and its two parents (depth 2);
      # nothing walks history.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 3

      - name: A merge that changes nothing must not merge green
        env:
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_BASE_REF: ${{ github.event.pull_request.base.ref }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_CHANGED_FILES: ${{ github.event.pull_request.changed_files }}
        run: .github/scripts/no-op-merge-guard.sh

  # The relay image, built the way publish-relay-image.yml builds it.
  #
  # It exists because that workflow only runs on push to main, so a Dockerfile
  # that cannot build was always discovered AFTER merge, with `:release` left
  # pointing at the previous build and the fleet quietly not updating. That is
  # not hypothetical: packages/relay/Dockerfile copies an explicit file list
  # rather than the whole package, so adding a build-time file at the package
  # root (version-define.ts, #146) broke the image while every other gate
  # stayed green.
  #
  # Build only -- no registry login, no push. It is deliberately NOT part of
  # the `build` job, whose wall clock is measured against a frozen baseline.
  image-build:
    name: Relay image builds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build the relay image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: packages/relay/Dockerfile
          push: false
          load: true
          tags: relay:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # The image is the thing that ships, so assert what it reports rather
      # than trusting that a successful build implies a working one.
      - name: It reports the version package.json declares
        run: |
          set -euo pipefail
          EXPECTED=$(jq -r .version packages/relay/package.json)
          ACTUAL=$(docker run --rm --entrypoint node relay:ci \
            -e "import('/app/dist/index.js').then(m => process.stdout.write(m.VERSION))")
          echo "package.json=$EXPECTED image=$ACTUAL"
          [ "$EXPECTED" = "$ACTUAL" ] || {
            echo "::error::the image reports $ACTUAL but package.json declares $EXPECTED"
            exit 1
          }

  # The black-box conformance suite (#187): a relay image is started as a
  # container with a stub connector beside it, and only its read and write
  # ports are spoken to. The same suite runs against both implementations
  # until the TypeScript source is removed (#185).
  #
  # `typescript` is the image `image-build` builds and the only one published.
  # `rust` (#192) is built here and nowhere else. It is built one surface at a
  # time (#185), and every case it does not pass yet is declared
  # `expectedFailureFor: ['rust']`, so the job is green on exactly what is
  # built and goes red the day a marked case starts passing.
  conformance:
    name: Conformance suite against the ${{ matrix.implementation }} relay image
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - implementation: typescript
            dockerfile: packages/relay/Dockerfile
            command: node dist/cli.js
            # buildx's default scope: the layers `image-build` already caches.
            cache-scope: buildkit
          - implementation: rust
            dockerfile: crates/relay/Dockerfile
            command: relay
            # Its own scope, or the two images evict each other's layers.
            cache-scope: relay-rust
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 8.15.9

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - uses: docker/setup-buildx-action@v3

      - name: Build the relay image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: false
          load: true
          tags: relay:conformance
          cache-from: type=gha,scope=${{ matrix.cache-scope }}
          cache-to: type=gha,mode=max,scope=${{ matrix.cache-scope }}

      # What a stack relies on without asking: the files already in a /data
      # volume belong to uid 1000, and compose healthchecks call `wget`.
      - name: It runs as uid 1000 and carries wget
        run: |
          set -euo pipefail
          IMAGE_UID=$(docker run --rm --entrypoint id relay:conformance -u)
          echo "uid=$IMAGE_UID"
          [ "$IMAGE_UID" = "1000" ] || {
            echo "::error::the image runs as uid $IMAGE_UID, not 1000"
            exit 1
          }
          docker run --rm --entrypoint sh relay:conformance -c 'command -v wget'

      - name: Run the suite against the image
        env:
          CONFORMANCE_IMAGE: relay:conformance
          CONFORMANCE_IMPL: ${{ matrix.implementation }}
          CONFORMANCE_COMMAND: ${{ matrix.command }}
        run: pnpm --filter @toon-protocol/relay-conformance conformance

  # Cutover and rollback are both an image swap over the same /data volume
  # (#201): each image is built and the volume case writes through one and
  # reads through the other, both ways. Needs both images, so it is its own job.
  image-swap:
    name: Either image opens the other's database
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 8.15.9

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - uses: docker/setup-buildx-action@v3

      - name: Build the TypeScript image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: packages/relay/Dockerfile
          push: false
          load: true
          tags: relay:swap-typescript
          cache-from: type=gha,scope=buildkit

      - name: Build the Rust image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: crates/relay/Dockerfile
          push: false
          load: true
          tags: relay:swap-rust
          cache-from: type=gha,scope=relay-rust

      - name: Both images run as the same user id
        run: |
          set -euo pipefail
          TS_UID=$(docker run --rm --entrypoint id relay:swap-typescript -u)
          RUST_UID=$(docker run --rm --entrypoint id relay:swap-rust -u)
          echo "typescript=$TS_UID rust=$RUST_UID"
          [ "$TS_UID" = "$RUST_UID" ] || {
            echo "::error::the images run as different users ($TS_UID, $RUST_UID)"
            exit 1
          }

      - name: Swap images over one volume, both ways
        env:
          CONFORMANCE_TYPESCRIPT_IMAGE: relay:swap-typescript
          CONFORMANCE_RUST_IMAGE: relay:swap-rust
        run: pnpm --filter @toon-protocol/relay-conformance conformance volume

  ci-ok:
    name: CI OK
    runs-on: ubuntu-latest
    needs:
      [
        build,
        rust-gate,
        devbox-validate,
        no-op-merge,
        changeset,
        image-build,
        conformance,
        image-swap,
      ]
    if: always()
    steps:
      # Fleet-wide aggregate required check (toon-meta#279): this job is the
      # single required status for the repo. It runs even when upstream jobs
      # fail, are cancelled, or are skipped (if: always()), and passes ONLY
      # when every gating job reports result == 'success' — a skipped or
      # cancelled gating job must never read as a pass.
      #
      # `changeset` is the one deliberate exception: it carries its own
      # `if: github.event_name == 'pull_request'`, so on a push event its
      # result is 'skipped' by design (release.yml already re-derives the
      # same release plan post-merge) — that must read as a pass. On a
      # pull_request event it has no `if:` of its own to skip it, so a
      # 'skipped' result there is still a real failure to catch.
      - name: Verify all gating jobs succeeded
        env:
          RESULTS: ${{ toJSON(needs) }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          echo "event: $EVENT_NAME"
          echo "Gating job results:"
          echo "$RESULTS" | jq -r 'to_entries[] | "  \(.key): \(.value.result)"'

          FAILED=$(echo "$RESULTS" | jq -r --arg event "$EVENT_NAME" '
            to_entries[]
            | select(.value.result != "success")
            | select((.key == "changeset" and .value.result == "skipped" and $event == "push") | not)
            | .key')
          if [ -n "$FAILED" ]; then
            echo "::error::Gating jobs did not succeed: $(echo "$FAILED" | tr '\n' ' ')"
            exit 1
          fi
          echo "All gating jobs succeeded."
