name: Publish relay-connector image

# Builds the relay-connector image (deploy/Dockerfile: the published TOON
# connector with this repo's deploy/connector.toml baked in) and pushes it to
# GHCR. This is the payment-proxy image that runs in front of the relay app.
#
# The relay app image is published separately (publish-relay-image.yml →
# ghcr.io/toon-protocol/relay). This image bakes a PINNED connector; bump
# deploy/Dockerfile's `ARG CONNECTOR_TAG` deliberately to adopt a newer one.
#
# That ARG default is the pin's single source of truth, which is why this build
# deliberately does NOT pass a CONNECTOR_TAG build-arg (relay#113): what ships
# to GHCR is exactly what that file names, with no second literal here to drift
# out of sync with it. deploy/.env.example carries its own copy too, but only
# for the local `docker compose up --build` path — it has no effect on this
# workflow or on the published image. Since connector#755 the pin names a Rust
# build (`rust-sha-<short>`); a plain semver tag is the retired TypeScript
# node, which reads YAML and cannot start on deploy/connector.toml.
#
# `latest` is (re)published on every push to main; version tags (vX.Y.Z) also
# publish semver tags for pinning, plus an immutable sha tag.

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

concurrency: publish-relay-connector-image-${{ github.ref }}

jobs:
  build-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Derive image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/relay-connector
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: deploy
          file: deploy/Dockerfile
          # No CONNECTOR_TAG build-arg here on purpose — deploy/Dockerfile's
          # own ARG default is the pin of record; see this workflow's header.
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
