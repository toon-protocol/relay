name: Publish relay-connector image

# Builds the relay-connector image (deploy/Dockerfile: the published TOON
# connector with this repo's deploy/connector.toml baked in) and pushes it to
# GHCR. This is the payment proxy that runs in front of the relay app; the
# relay app image is published separately (publish-relay-image.yml →
# ghcr.io/toon-protocol/relay).
#
# The image bakes a PINNED connector, and deploy/Dockerfile's
# `ARG CONNECTOR_TAG` is the pin's single source of truth — which is why this
# build deliberately passes NO CONNECTOR_TAG build-arg: what ships to GHCR is
# exactly what that file names, with no second literal here to drift out of
# sync with it. Baking the config alongside the pin is what makes the two move
# in one reviewed commit, so a connector build can never reach a box ahead of
# the config it needs. deploy/bundle.test.ts fails the build if a second copy
# of the pin ever appears.
#
# Tags, matching publish-relay-image.yml so the two images move together:
#   latest  — every push to main
#   release — every push to main; the moving tag each box's label-scoped
#             Watchtower follows, so an auto-redeploy only ever follows a
#             commit that landed on main and built here
#   sha-*   — immutable, the pinning/rollback handle
#   vX.Y.Z  — semver tags, on a version tag push

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

concurrency: publish-relay-connector-image-${{ github.ref }}

jobs:
  build-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Derive image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/relay-connector
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=raw,value=release,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: deploy
          file: deploy/Dockerfile
          # No CONNECTOR_TAG build-arg here on purpose — deploy/Dockerfile's
          # own ARG default is the pin of record; see this workflow's header.
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
