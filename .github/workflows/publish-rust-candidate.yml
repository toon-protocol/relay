name: Publish Rust relay candidate

# Publishes the Rust relay (crates/relay/Dockerfile, spec #185) from main so
# it can be soaked before any stack follows it automatically (#202).
#
# It is a CANDIDATE, and the tags say so. The same GHCR repository carries the
# TypeScript image, which owns `:release` and `:latest` until the cutover;
# nothing here may move either (deploy/rust-workspace.test.ts fails the build
# if it tries). Every tag this workflow writes starts with `rust-`, the
# connector's convention for its own Rust image:
#
#   rust-candidate         moves on every publish; what a soak follows
#   rust-<handle>          immutable release handle, YYYY.MM.DD.N (UTC date and
#                          that day's ordinal), the connector's scheme
#   rust-sha-<short sha>   immutable per-commit tag, for rollback
#
# The handle is also the version the image reports on /health and in the Relay
# Information Document (the crate stays at 0.1.0 and is not published).
#
# It publishes only after the conformance suite has passed against this
# commit's Rust image, so a candidate is always a build the suite accepted.

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency: publish-rust-candidate

permissions:
  contents: read
  packages: write

jobs:
  conformance:
    name: Conformance suite against the Rust image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 8.15.9

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - uses: docker/setup-buildx-action@v3

      - name: Build the Rust image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: crates/relay/Dockerfile
          push: false
          load: true
          tags: relay:conformance
          cache-from: type=gha,scope=relay-rust

      - name: Run the suite against the image
        env:
          CONFORMANCE_IMAGE: relay:conformance
          CONFORMANCE_IMPL: rust
          CONFORMANCE_COMMAND: relay
        run: pnpm --filter @toon-protocol/relay-conformance conformance

  publish:
    name: Push the candidate
    needs: conformance
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # The handle is the UTC date plus the next free ordinal for that date,
      # read from the tags already on the package, so a second publish the same
      # day is `.2` and nothing ever reuses one.
      - name: Choose the release handle
        id: handle
        env:
          GH_TOKEN: ${{ github.token }}
          OWNER: ${{ github.repository_owner }}
        run: |
          set -euo pipefail
          DATE=$(date -u +%Y.%m.%d)
          TAKEN=$(gh api --paginate "/orgs/$OWNER/packages/container/relay/versions" \
                    --jq '.[].metadata.container.tags[]' 2>/dev/null \
                  | grep -E "^rust-${DATE//./\\.}\.[0-9]+\$" \
                  | sed -E 's/.*\.([0-9]+)$/\1/' | sort -n | tail -1 || true)
          HANDLE="$DATE.$(( ${TAKEN:-0} + 1 ))"
          echo "handle=$HANDLE"
          echo "handle=$HANDLE" >> "$GITHUB_OUTPUT"

      - name: Derive tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/relay
          flavor: latest=false
          tags: |
            type=raw,value=rust-candidate
            type=raw,value=rust-${{ steps.handle.outputs.handle }}
            type=sha,prefix=rust-sha-

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: crates/relay/Dockerfile
          push: true
          build-args: |
            TOON_RELEASE_HANDLE=${{ steps.handle.outputs.handle }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=relay-rust
          cache-to: type=gha,mode=max,scope=relay-rust
