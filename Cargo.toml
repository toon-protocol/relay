# The Rust relay (#185), built beside the TypeScript package until the cutover.
# Standards: docs/rust-coding-standards.md.
[workspace]
resolver = "3"
members = ["crates/git-objects", "crates/relay", "crates/relay-ui", "crates/ui-highlight-web", "crates/ui-nip34", "crates/ui-nip34-web", "crates/xtask"]

[workspace.package]
edition = "2024"
license = "MIT"

# Inherited by every member (`[lints] workspace = true`), which
# deploy/rust-workspace.test.ts checks. `forbid`, not `deny`: a crate cannot
# `#[allow]` its way back out.
[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.dependencies]
axum = { version = "0.8", default-features = false, features = ["http1", "json", "tokio"] }
base64 = "0.22"
# The connector's domain crate, for the types of its `GET /ilp`
# self-description and nothing else: it also holds claim and pricing types,
# and payment-claim validation lives only in the connector (CLAUDE.md), so
# deploy/rust-workspace.test.ts fails the build if a Rust file names anything
# but `connector_domain::node` and the settlement terms that document lists.
# The commit is the one the connector image that deploy/docker-compose.yml
# pins was built from; deploy/bundle.test.ts holds the two together (#199):
# the release named on the next line is the image tag's release handle, and
# `rev` is the commit that release is tagged at.
# connector-release: 2026.10.23.1
connector-domain = { git = "https://github.com/toon-protocol/connector", rev = "d3e2bd514cc713f4034bdc062c7b30f3ec84d275" }
# Git objects verified and parsed from bytes, for the browser half of /repo.
git-objects = { path = "crates/git-objects" }
js-sys = "0.3"
# Pure Rust (miniz_oxide) so crates/git-objects builds for wasm32.
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
futures-util = { version = "0.3", default-features = false, features = ["sink"] }
http-body-util = "0.1"
hyper = { version = "1", features = ["client", "http1"] }
hyper-util = { version = "0.1", features = ["client-legacy", "http1", "tokio"] }
# The protocol crate: events, filters and matching one against the other.
# NIP-01 messages and subscriptions are the relay's own
# (crates/relay/src/session.rs). The relay was built on nostr-sdk's
# `local_relay`, which this crate is the protocol half of; #237 removed it and
# deploy/rust-workspace.test.ts keeps it out. The pin is exact because the
# store holds this crate's reading of a filter and an event.
nostr = { version = "=0.45.4", default-features = false, features = ["std", "nip06"] }
# The app UIs the relay serves on its read port (#276).
relay-ui = { path = "crates/relay-ui" }
# `bundled`: SQLite is compiled in, so the image stays one static binary.
rusqlite = { version = "0.40", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha1 = "0.10"
sha2 = "0.10"
similar = { version = "2", default-features = false, features = ["text"] }
# Syntax highlighting for blob pages (#287). `regex-fancy` is the pure Rust
# regex engine: no onig, so no C and the crate builds for wasm32. The syntaxes
# are compiled in by crates/ui-highlight-web/build.rs, not syntect's bundled
# set, so only the languages the page highlights are shipped.
syntect = { version = "5", default-features = false, features = ["parsing", "dump-load", "regex-fancy"] }
tempfile = "3"
thiserror = "2"
tokio = { version = "1", features = ["io-util", "macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
tokio-tungstenite = { version = "0.28", default-features = false, features = ["connect", "handshake"] }
tower = { version = "0.5", features = ["util"] }
trybuild = "1"
ui-nip34 = { path = "crates/ui-nip34" }
# The browser half of /repo (#283). The pin is exact and is the version of
# the `wasm-bindgen-cli` crates/relay/Dockerfile installs: the generated glue
# and the module must come from the same one (deploy/rust-workspace.test.ts).
wasm-bindgen = "=0.2.129"
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3", features = [
    "AbortController",
    "AbortSignal",
    "CssStyleDeclaration",
    "Document",
    "Element",
    "Headers",
    "HtmlElement",
    "MutationObserver",
    "MutationObserverInit",
    "Node",
    "ReadableStream",
    "ReadableStreamDefaultReader",
    "ReferrerPolicy",
    "Request",
    "RequestCredentials",
    "RequestInit",
    "RequestMode",
    "Response",
    "Window",
] }
