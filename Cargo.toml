# The Rust relay (#185), built beside the TypeScript package until the cutover.
# Standards: docs/rust-coding-standards.md.
[workspace]
resolver = "3"
members = ["crates/relay"]

[workspace.package]
edition = "2024"
license = "MIT"

# Inherited by every member (`[lints] workspace = true`), which
# deploy/rust-workspace.test.ts checks. `forbid`, not `deny`: a crate cannot
# `#[allow]` its way back out.
[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.dependencies]
axum = { version = "0.8", default-features = false, features = ["http1", "json", "tokio"] }
base64 = "0.22"
# The connector's domain crate, for the types of its `GET /ilp`
# self-description and nothing else: it also holds claim and pricing types,
# and payment-claim validation lives only in the connector (CLAUDE.md), so
# deploy/rust-workspace.test.ts fails the build if a Rust file names anything
# but `connector_domain::node` and the settlement terms that document lists.
# The commit is the one the connector image that deploy/docker-compose.yml
# pins was built from; deploy/bundle.test.ts holds the two together (#199):
# the release named on the next line is the image tag's release handle, and
# `rev` is the commit that release is tagged at.
# connector-release: 2026.09.29.1
connector-domain = { git = "https://github.com/toon-protocol/connector", rev = "c5f0bc359228beb760429971650290b606f472c7" }
futures-util = { version = "0.3", default-features = false, features = ["sink"] }
http-body-util = "0.1"
hyper = { version = "1", features = ["client", "http1"] }
hyper-util = { version = "0.1", features = ["client-legacy", "http1", "tokio"] }
# The protocol crate: events, filters and matching one against the other.
# NIP-01 messages and subscriptions are the relay's own
# (crates/relay/src/session.rs). The relay was built on nostr-sdk's
# `local_relay`, which this crate is the protocol half of; #237 removed it and
# deploy/rust-workspace.test.ts keeps it out. The pin is exact because the
# store holds this crate's reading of a filter and an event.
nostr = { version = "=0.45.4", default-features = false, features = ["std", "nip06"] }
# `bundled`: SQLite is compiled in, so the image stays one static binary.
rusqlite = { version = "0.40", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha1 = "0.10"
sha2 = "0.10"
tempfile = "3"
thiserror = "2"
tokio = { version = "1", features = ["io-util", "macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
tokio-tungstenite = { version = "0.28", default-features = false, features = ["connect", "handshake"] }
tower = { version = "0.5", features = ["util"] }
trybuild = "1"
