# The Rust relay (#185), built beside the TypeScript package until the cutover.
# Standards: docs/rust-coding-standards.md.
[workspace]
resolver = "3"
members = ["crates/relay"]

[workspace.package]
edition = "2024"
license = "MIT"

# Inherited by every member (`[lints] workspace = true`), which
# deploy/rust-workspace.test.ts checks. `forbid`, not `deny`: a crate cannot
# `#[allow]` its way back out.
[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.dependencies]
axum = { version = "0.8", default-features = false, features = ["http1", "json", "tokio"] }
base64 = "0.22"
futures-util = { version = "0.3", default-features = false, features = ["sink"] }
http-body-util = "0.1"
hyper = "1"
hyper-util = { version = "0.1", features = ["tokio"] }
# The protocol crate of the framework #185 names, on that framework's exact pin.
nostr = { version = "=0.45.4", default-features = false, features = ["std"] }
# The framework: NIP-01 messages, subscriptions and fan-out (`local_relay`).
# Its API is declared alpha, so the pin is exact and crates/relay/src/framework.rs
# is the only module that imports it (deploy/rust-workspace.test.ts). The pin
# does not reach its own framework crates (nostr-memory, async-wsocket), which
# it asks for by range: Cargo.lock holds those still.
nostr-sdk = { version = "=0.45.4", default-features = false, features = ["local-relay"] }
# The framework's database trait. It is named here only because nostr-sdk
# does not re-export the trait's error type, so the trait cannot be
# implemented through nostr-sdk alone. Same rule: exact pin, adapter only.
nostr-database = { version = "=0.45.2", default-features = false }
# `bundled`: SQLite is compiled in, so the image stays one static binary.
rusqlite = { version = "0.40", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha1 = "0.10"
tempfile = "3"
thiserror = "2"
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread", "signal", "sync"] }
tokio-tungstenite = { version = "0.28", default-features = false, features = ["connect", "handshake"] }
tower = { version = "0.5", features = ["util"] }
trybuild = "1"
