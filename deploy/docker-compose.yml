# =============================================================================
# A TOON relay node: Caddy (TLS) → connector (payments) → relay (Nostr).
# =============================================================================
#
#   payer  ──POST /ilp──▶ caddy ─▶ connector ──POST /write───────────▶ relay  (stored)
#                                             ──POST /write-ephemeral▶ relay  (broadcast only)
#   reader ──wss────────▶ caddy ─────────────────────────────────────▶ relay  (free reads)
#
# The connector monetizes WRITES. READS are free and never touch it.
#
# ── The privacy invariant, enforced by construction ──────────────────────────
# Caddy is the only service reachable from the internet. It is the only one
# with an unqualified publish; the connector's edge (3000) is published to
# 127.0.0.1 ONLY, and the relay's write (3100) and read (7100) ports are
# `expose`d on the compose network and nothing else. So the only way in to a
# write is a payment through the connector.
#
# This is a security precondition, not just tidiness: the relay skips schnorr
# verification for PAID ephemeral kinds on the assumption that 3100 is
# reachable exclusively through the payment-gating connector. If you change
# that, set RELAY_VERIFY_EPHEMERAL=true. And remember a docker `ports:`
# publish WITHOUT a host-IP prefix is internet-reachable even with ufw locked
# to 22/80/443 — Docker's iptables chain runs ahead of ufw. Never convert an
# `expose:` here into a bare `ports:`, and never drop the `127.0.0.1:` from
# the connector's.
#
#   Production:  docker compose up -d
#   Local, no TLS:
#     docker compose -f docker-compose.yml -f docker-compose.local.yml up -d
#   With auto-redeploy:
#     docker compose -f docker-compose.yml -f docker-compose.watchtower.yml up -d
# =============================================================================

name: relay

services:
  # ── TLS ────────────────────────────────────────────────────────────────────
  caddy:
    image: caddy:2-alpine
    environment:
      # The public names this node answers to, and the address Let's Encrypt
      # sends expiry notices to. All three are required — see .env.example.
      EDGE_HOST: ${EDGE_HOST:?set EDGE_HOST in .env (the connector edge hostname)}
      READ_HOST: ${READ_HOST:?set READ_HOST in .env (the free-read WS hostname)}
      ACME_EMAIL: ${ACME_EMAIL:?set ACME_EMAIL in .env}
    ports:
      - '80:80'
      - '443:443'
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      # Certificates and ACME account keys. Named, so a `docker compose up`
      # that recreates this container does not re-issue every certificate and
      # walk into Let's Encrypt's rate limit.
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      connector:
        condition: service_healthy
      relay:
        condition: service_healthy
    restart: unless-stopped

  # ── The payment proxy ──────────────────────────────────────────────────────
  #
  # The STOCK connector image on an immutable pin, with this directory's
  # connector.toml mounted in. Same image and same shape as the store and
  # gas-station bundles — one connector deployment model across the fleet.
  #
  # ── Bumping the pin ────────────────────────────────────────────────────────
  # This `image:` line is the pin of record; deploy/bundle.test.ts fails the
  # build if a second copy of a connector build appears anywhere else.
  #
  # Pin an exact `rust-sha-` build, never the floating `rust-main` or the
  # fleet's `rust-release` pointer. The config parser is `deny_unknown_fields`
  # and startup is fail-closed, so a schema drift under you is a
  # refuse-to-start rather than a degraded run — which is the behaviour you
  # want, but it means an accidental bump is an outage. The pin and the
  # connector.toml it was validated against live at the same commit here, and
  # the box takes both with one `git pull`, so a build can never reach a box
  # ahead of the config it needs.
  #
  # `rust-sha-c714551` is the first pin this bundle has shipped on which a
  # peering established over the operator surface (`POST /peers`, connector
  # ADR 0058) can PAY for the packets it forwards (connector#1230) — the
  # previous pin could accept such a peering's claims but never sign one. It
  # also speaks the `[node]` self-description (ADR 0050) and states a verified
  # payment to the app on delivery (ADR 0040), as its predecessor did.
  #
  # Because the pin is IMMUTABLE, this container does not auto-deploy: there
  # is no moving tag for Watchtower to follow, so a connector or config change
  # needs `git pull && docker compose up -d` on the box. The label below stays
  # for shape-parity with the other two bundles, and is inert here.
  connector:
    image: ghcr.io/toon-protocol/connector:rust-2026.08.28.1
    # No `environment:` block, deliberately: the connector has no
    # environment-variable layer at all. Every value comes from the mounted
    # ./connector.toml, so there is exactly one place any value comes from.
    labels:
      # Watchtower only ever touches a container carrying this label, and only
      # when docker-compose.watchtower.yml is in the file set. Inert for this
      # service while the image above is pinned to an immutable tag.
      com.centurylinklabs.watchtower.enable: 'true'
    volumes:
      # The whole connector configuration — routes, prices, settlement, and
      # what this node says about itself. Mounted, not baked: the pin above
      # and this file are the same reviewed commit, and the box takes both
      # with one `git pull`. It names key PATHS only and holds nothing secret.
      - ./connector.toml:/app/config/connector.toml:ro
      # Two identities, provisioned two different ways — see connector.toml.
      # In short: the signer holds no money and is fresh random material per
      # box; the settlement key is what clients open channels against, so it
      # comes from a seed you can reproduce. Both must exist and be readable
      # by uid 10001 before the first `up -d`.
      - ./signer.key:/app/data/signer.key:ro
      - ./settlement.key:/app/data/settlement.key:ro
      # Drop this line (and connector.toml's [settlement.solana]) for EVM-only.
      - ./settlement-solana.key:/app/data/settlement-solana.key:ro
      # The operator surface's two credentials -- see connector.toml's
      # [operator]. The bearer token gates reads; the allowlist holds the
      # PUBLIC halves of the keys allowed to sign a write. The private half
      # never lives on this box.
      - ./operator-bearer.token:/app/data/operator-bearer.token:ro
      - ./operator-write.keys:/app/data/operator-write.keys:ro
      # The claim journal. NAMED, not a host bind: the image ships /app/state
      # owned by uid 10001, which is what a fresh named volume inherits on
      # first mount and what a bind mount does not. Replaying it is what stops
      # a restart from re-accepting a claim the payer already spent.
      - connector_state:/app/state
    ports:
      # LOOPBACK ONLY. Public traffic reaches the edge through Caddy; this
      # publish is for on-box operator calls (`/peers`, `/channels`) and
      # nothing else. Dropping the `127.0.0.1:` would put the edge on the
      # internet — see the privacy invariant above.
      - '127.0.0.1:3000:3000'
    healthcheck:
      # The connector has no /health route. GET /ilp/identity answers 200 only
      # once the process is serving AND has read its signer key file.
      # 127.0.0.1, never localhost: the listener is IPv4-only, but "localhost"
      # in a container can resolve to ::1, where nothing is listening.
      test: ['CMD-SHELL', 'wget -q --spider http://127.0.0.1:3000/ilp/identity || exit 1']
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 15s
    depends_on:
      relay:
        condition: service_healthy
    restart: unless-stopped

  # ── The relay ──────────────────────────────────────────────────────────────
  relay:
    image: ${RELAY_IMAGE:-ghcr.io/toon-protocol/relay:release}
    labels:
      com.centurylinklabs.watchtower.enable: 'true'
    environment:
      TOON_BLS_PORT: '3100' # writes  — private
      TOON_RELAY_PORT: '7100' # reads   — fronted by Caddy
      TOON_DATA_DIR: /data
      # The relay's own Nostr IDENTITY (not money). It will not boot without
      # one, and changing it changes the pubkey clients know this relay by.
      NOSTR_SECRET_KEY: ${RELAY_NOSTR_SECRET_KEY:?set RELAY_NOSTR_SECRET_KEY in .env (32-byte hex)}
      # true skips event-signature verification on writes. Smoke tests only.
      TOON_DEV_MODE: ${RELAY_DEV_MODE:-false}
      # Paid-ephemeral verify skip: ephemeral kinds (20000-29999) keep the id
      # check but skip schnorr, which is safe only because 3100 is reachable
      # exclusively through the payment-gating connector (see the privacy
      # invariant above). Set true if you front 3100 with anything else.
      TOON_VERIFY_EPHEMERAL: ${RELAY_VERIFY_EPHEMERAL:-false}
      # WS read-connection cap. Each costs one file descriptor.
      TOON_MAX_CONNECTIONS: ${RELAY_MAX_CONNECTIONS:-4096}
      # Retention. With enforcement on, an event past its own NIP-40
      # `expiration` stops being served and is deleted after the grace window.
      # RELAY_ENFORCE_EXPIRATION=false is the kill switch — set it and
      # restart, and every still-stored event is served again. That recovery
      # only works while the data is still on disk, which is what the grace
      # buys. See docs/retention.md.
      TOON_ENFORCE_EXPIRATION: ${RELAY_ENFORCE_EXPIRATION:-true}
      TOON_EXPIRATION_REAP_GRACE_SECONDS: ${RELAY_EXPIRATION_REAP_GRACE_SECONDS:-86400}
      TOON_EXPIRATION_REAP_INTERVAL_SECONDS: ${RELAY_EXPIRATION_REAP_INTERVAL_SECONDS:-3600}
      # Comma-separated 64-hex EVENT IDS this relay refuses to store or serve.
      # The last resort for an event whose author key is gone. Ids only, never
      # pubkeys — read docs/retention.md before adding one.
      TOON_BLOCKED_EVENT_IDS: ${RELAY_BLOCKED_EVENT_IDS:-}
      # Free ephemeral lane bounds. This lane has no payment gate, so these
      # ARE its admission control.
      TOON_EPHEMERAL_RATE_LIMIT: ${RELAY_EPHEMERAL_RATE_LIMIT:-200}
      TOON_EPHEMERAL_RATE_WINDOW_MS: ${RELAY_EPHEMERAL_RATE_WINDOW_MS:-10000}
      TOON_EPHEMERAL_MAX_BODY_BYTES: ${RELAY_EPHEMERAL_MAX_BODY_BYTES:-8192}
    volumes:
      # events.db. Named so it has a name an operator can find and a stray
      # `docker volume prune` — which reaps unused ANONYMOUS volumes — cannot
      # take it.
      - relay_data:/data
    expose:
      - '3100' # writes — PRIVATE, only the connector dials this
      - '7100' # reads  — fronted by Caddy
    healthcheck:
      test: ['CMD-SHELL', 'wget -q --spider http://127.0.0.1:3100/health || exit 1']
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s
    restart: unless-stopped

volumes:
  caddy_data:
  caddy_config:
  connector_state:
  relay_data:
