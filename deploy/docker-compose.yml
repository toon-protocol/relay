# =============================================================================
# relay deploy — connector (payment proxy) + oblivious Nostr relay. NO Caddy.
# =============================================================================
# The connector monetizes WRITES; READS are free and hit the relay's WS directly.
# A second, zero-priced route (relay#129) carries the FREE ephemeral write
# lane (presence/typing, kinds 20000-29999) to its own relay endpoint — still
# claim-gated at the client edge like every route here, just priced at 0; see
# connector.toml's own comment on `g.toon.relay.ephemeral`.
# TLS is terminated by the deployment environment, which reverse-proxies to the
# host-published edge (:3000) and to the free-read WS (:7100).
#
#   payer ──POST /ilp──▶ connector ──POST /write────────────▶ relay:3100  (paid store; PRIVATE)
#                                  ──POST /write-ephemeral──▶ relay:3100  (free broadcast-only; PRIVATE)
#   reader ──wss REQ (free)───────────────────────────────▶ relay:7100  (Nostr reads; PUBLIC)
#
# PRIVACY INVARIANT (enforced by construction):
#   - relay :3100 (paid-write store + free ephemeral broadcast) → NEVER
#     host-published; only connector:3100.
#   - The connector publishes exactly one port (:3000); the Rust node has no
#     separate admin/health port (the TypeScript node's :8081/:8080 do not
#     exist here — see the connector service's own comment below).
#   The only host-bound ports are the edge :3000 and the free-read WS :7100,
#   and both bind BIND_ADDR (default 127.0.0.1, never 0.0.0.0) so the only
#   public door is the deployment environment's TLS terminator.
#   This invariant is also a SECURITY precondition since relay#85: the relay
#   skips schnorr verification for paid ephemeral kinds on the assumption that
#   :3100 is reachable exclusively through the payment-gating connector. The
#   free ephemeral write lane (relay#129) does NOT rely on this precondition
#   — it always runs full verification regardless of exposure — but it stays
#   behind the same private port like everything else on :3100.
#   Remember docker `ports:` publishes bypass ufw — keep :3100 on `expose:`.
#
# Dev:  docker compose up --build   (builds relay-connector locally from ./Dockerfile)
# Prod: docker compose up           (pulls the pinned RELAY_CONNECTOR_IMAGE)
# =============================================================================

services:
  # ── The payment proxy (connector + baked relay route config) ────────────────
  connector:
    image: ${RELAY_CONNECTOR_IMAGE:-ghcr.io/toon-protocol/relay-connector:latest}
    build:
      context: .
      dockerfile: Dockerfile
      args:
        CONNECTOR_TAG: ${CONNECTOR_TAG:-rust-sha-440eab7}
    # NO `environment:` block, deliberately. The Rust connector has no
    # environment-variable layer at all (connector#755): every value comes from
    # the baked ./connector.toml, so there is exactly one place any value comes
    # from. The three variables that used to live here are all gone —
    # CONFIG_FILE (the image's CMD already names the path), TOON_MNEMONIC (the
    # settlement key is a mounted FILE now, derived outside the container), and
    # NODE_TLS_REJECT_UNAUTHORIZED (a Node.js escape hatch with no equivalent;
    # a self-signed RPC cert is now a hard TLS failure, so point the config at
    # an RPC with a real chain of trust).
    volumes:
      # Two key files, provisioned two DIFFERENT ways — see ./connector.toml.
      # In short: the signer is this node's ILP identity and holds no money, so
      # it is fresh random material per box; the settlement key spends real
      # testnet value and is the identity clients open their channels against,
      # so it is derived from a seed you can reproduce. Both must exist and be
      # readable by uid 10001 before the first `up -d` — a bind mount keeps its
      # HOST ownership inside the container, so `chown 10001:10001` them or the
      # container restart-loops on "Permission denied".
      - ./signer.key:/app/data/signer.key:ro
      - ./settlement.key:/app/data/settlement.key:ro
      # The durable claim journal (connector#605). NAMED, not a host bind: the
      # image ships /app/state owned by uid 10001, which is what a fresh named
      # volume inherits on first mount and what a bind mount does not. Replaying
      # this journal is what makes a channel's replay watermark survive a
      # restart; without it, every claim a payer already spent becomes free
      # service again.
      - connector_state:/app/state
    ports:
      - '${BIND_ADDR:-127.0.0.1}:${EDGE_PORT:-3000}:3000' # paid POST /ilp edge (the env's TLS terminator fronts this)
    # No `expose: 8080`. The client edge, the operator surface and /metrics all
    # share :3000 on the Rust connector; the TypeScript node's separate health
    # (:8080) and admin (:8081) ports do not exist.
    depends_on:
      relay:
        condition: service_healthy
    restart: unless-stopped

  # ── The oblivious relay (real Nostr relay) ──────────────────────────────────
  # Published relay image. The paid-write HTTP store port (3100, POST /write) is
  # NOT published — only the connector dials it over the compose network
  # (relay:3100), which enforces the privacy invariant.
  relay:
    image: ${RELAY_IMAGE:-ghcr.io/toon-protocol/relay:latest}
    environment:
      TOON_BLS_PORT: '3100' # paid-write HTTP store (POST /write) — PRIVATE
      TOON_RELAY_PORT: '7100' # free-read Nostr WS — published
      # The relay CLI REQUIRES an identity key to boot (this is IDENTITY, not
      # money). Generate an ephemeral 32-byte hex into RELAY_NOSTR_SECRET_KEY in .env.
      NOSTR_SECRET_KEY: ${RELAY_NOSTR_SECRET_KEY:?set RELAY_NOSTR_SECRET_KEY in .env (32-byte hex)}
      # Enforce Nostr signature verification on writes (public deploy → false).
      TOON_DEV_MODE: ${RELAY_DEV_MODE:-false}
      # Paid-ephemeral verify skip (relay#85): ephemeral kinds (20000-29999)
      # skip schnorr by default (id check kept) because :3100 is reachable
      # ONLY via the payment-gating connector (see PRIVACY INVARIANT above —
      # and note docker `ports:` publishes bypass ufw, so :3100 must stay
      # `expose:`-only). Set RELAY_VERIFY_EPHEMERAL=true to restore full
      # verification (e.g. if you front :3100 with anything else).
      TOON_VERIFY_EPHEMERAL: ${RELAY_VERIFY_EPHEMERAL:-false}
      # WS read-connection cap (relay#90): default 4096 (fd-shaped; docker's
      # default nofile limit is far above this). The stock 100 made >100
      # huddle listeners impossible.
      TOON_MAX_CONNECTIONS: ${RELAY_MAX_CONNECTIONS:-4096}
      # ── Retention (relay#137) ──────────────────────────────────────────────
      # NIP-40 expiry enforcement. ON by default: an event past its own
      # `expiration` tag stops being served, and the reaper deletes it after
      # the grace window. Devnet's kind:10032 announces carry a 600s TTL and
      # are refreshed every 240s, so the live margin is 2.5 refresh periods —
      # but the store and swap announce loops PAY for each republish, so a
      # drained payment channel turns "a stale announce is still served" into
      # "the node vanishes from discovery".
      #
      # RELAY_ENFORCE_EXPIRATION=false is the KILL SWITCH: set it in .env and
      # restart, and every still-stored event is served again. That recovery
      # only works while the data is still on disk, which is what the reap
      # grace (default 24h) buys. See docs/retention.md.
      TOON_ENFORCE_EXPIRATION: ${RELAY_ENFORCE_EXPIRATION:-true}
      TOON_EXPIRATION_REAP_GRACE_SECONDS: ${RELAY_EXPIRATION_REAP_GRACE_SECONDS:-86400}
      TOON_EXPIRATION_REAP_INTERVAL_SECONDS: ${RELAY_EXPIRATION_REAP_INTERVAL_SECONDS:-3600}
      # Operator blocklist: comma-separated 64-hex EVENT IDS this relay
      # refuses to store or serve. The last resort for an event whose author
      # key is gone, so neither NIP-01 replacement nor NIP-09 deletion can
      # reach it. Ids only, never pubkeys — read the hazard section in
      # docs/retention.md before adding one. Empty by default; every entry is
      # logged at startup.
      TOON_BLOCKED_EVENT_IDS: ${RELAY_BLOCKED_EVENT_IDS:-}
      # Free ephemeral write lane bounds (relay#129, POST /write-ephemeral —
      # see connector.toml's `g.toon.relay.ephemeral` route). This lane has
      # no payment gate, so these ARE its admission control; the relay's own
      # conservative defaults apply if left unset.
      TOON_EPHEMERAL_RATE_LIMIT: ${RELAY_EPHEMERAL_RATE_LIMIT:-200}
      TOON_EPHEMERAL_RATE_WINDOW_MS: ${RELAY_EPHEMERAL_RATE_WINDOW_MS:-10000}
      TOON_EPHEMERAL_MAX_BODY_BYTES: ${RELAY_EPHEMERAL_MAX_BODY_BYTES:-8192}
    ports:
      - '${BIND_ADDR:-127.0.0.1}:${RELAY_WS_PORT:-7100}:7100' # free reads (the env's TLS terminator fronts this)
    expose:
      - '3100' # paid-write store — PRIVATE (only the connector dials relay:3100)
    healthcheck:
      # 127.0.0.1, not localhost (relay#94): the write listener's host default
      # is 0.0.0.0 (IPv4-only), but "localhost" inside the container can
      # resolve to ::1, which nothing is listening on — wget then fails and
      # the container flaps unhealthy despite the app being fine.
      test:
        ['CMD-SHELL', 'wget -q --spider http://127.0.0.1:3100/health || exit 1']
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s
    restart: unless-stopped

volumes:
  # The claim journal. Named so a fresh mount inherits the image's uid-10001
  # ownership of /app/state; see the connector service's `volumes:` above for
  # why it must outlive the container.
  connector_state:

networks:
  default:
    name: relay_deploy_net
