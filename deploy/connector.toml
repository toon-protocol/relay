# =============================================================================
# The connector in front of this relay — the payment proxy.
# =============================================================================
# Baked into the relay-connector image at /app/config/connector.toml (see
# ./Dockerfile), so the image is a self-contained deployable: one artifact
# carries both the connector build and the config it was validated against.
#
# This is the config the live TOON devnet relay runs. To run your own node,
# change [node] to your hostnames and the prices to yours; everything else
# can stay as it is.
#
# Three things to know before editing:
#   1. There is NO environment-variable layer. Every value comes from this
#      file. The only variable the binary reads is RUST_LOG.
#   2. Every table is `deny_unknown_fields`. An unrecognised key — a typo, or
#      one from an older connector — is a load failure that names it.
#   3. Startup is FAIL-CLOSED. A missing key file, an unwritable state_dir, or
#      a settlement chain it cannot reach is `exit 1` with the reason, never a
#      degraded run.
# =============================================================================

# The one listener. POST /ilp, GET /ilp (self-description), GET /ilp/btp,
# GET /ilp/identity and the operator surface all share it — there is no
# separate admin or health port. 0.0.0.0 so the compose network reaches it;
# the port is never published to the host (see docker-compose.yml).
client_edge_addr = "0.0.0.0:3000"

# Durable claim state, on a named volume.
#
# The append-only claim journals live here, and replaying them is what makes a
# channel's replay watermark survive a restart. Without a volume, every
# watermark resets on restart, a channel with no watermark accepts any nonce,
# and every claim a payer already spent buys service again.
state_dir = "/app/state"

# ── Identity ─────────────────────────────────────────────────────────────────
# A LOCATION, never the key itself: 64 hex characters holding a secp256k1
# secret key. This is the connector's own ILP signing identity — it holds no
# money, so it is fresh random material per box:
#
#   openssl rand -hex 32 > signer.key
#   chmod 600 signer.key && sudo chown 10001:10001 signer.key
#
# A bind-mounted file keeps its HOST ownership inside the container, so a
# root-owned key is unreadable to uid 10001 and the container restart-loops on
# "Permission denied". The chown is the fix; `chmod 644` is not.
[signer]
key_file = "/app/data/signer.key"

# ── What this node says about itself ─────────────────────────────────────────
# The facts a node cannot introspect: from inside a container it sees
# 0.0.0.0:3000 and a private network, never its own public name. They are
# served, free and unauthenticated, on `GET /ilp` — a stranger with this URL
# needs nothing else to transact with it.
#
# Replace all three with your own hostnames.
[node]
addresses = ["g.toon.relay", "g.toon.relay.ephemeral"]
http_endpoint = "https://proxy.relay.devnet.toonprotocol.dev/ilp"
btp_endpoint = "wss://proxy.relay.devnet.toonprotocol.dev/ilp/btp"

# ── Paid writes ──────────────────────────────────────────────────────────────
[[routes]]
prefix = "g.toon.relay"

# `/write`, not the bare origin: the connector POSTs to exactly this URL, and
# the relay serves only /write, /write-ephemeral, /health and /metrics. A
# sender's own envelope target resolves strictly BENEATH this path, so nobody
# can address /health through this route at this route's price.
handler_url = "http://relay:3100/write"

# 1 micro-USDC per write, in the settlement asset's smallest unit (6-decimal
# USDC). A price is REQUIRED on a terminated route — it is never silently
# free — and keeping it non-zero is what keeps the x402 greeting armed.
price = 1

# The devnet relay pins BTP because its heaviest client holds a persistent
# session at 49 frames/second, where a session amortizes the handshake and
# claim round trip. Transport is per-connector policy, not a protocol
# constant: drop this line to serve one-shot HTTP buyers too.
transport = "btp"

# ── Free ephemeral writes (presence, typing) ─────────────────────────────────
# A separate route, not a second alias: the same handler_url cannot carry two
# prices, so free traffic needs its own prefix and its own relay endpoint.
[[routes]]
prefix = "g.toon.relay.ephemeral"

# The relay's second write surface. It accepts ONLY ephemeral kinds
# (20000-29999), never stores, and always runs full signature verification —
# this route has no payment gate to lean on, unlike the paid one above.
handler_url = "http://relay:3100/write-ephemeral"

# Explicitly free. Presence and typing are pay-for-what-persists traffic that
# never persists, so charging per write was never the design. `price = 0`
# states that rather than leaving it implicit — the parser requires a price
# either way.
price = 0

# ── Getting paid ─────────────────────────────────────────────────────────────
# With this section, anyone who opens a channel on chain can pay this node
# with no config edit, and the accepted claim's watermark is journaled under
# state_dir. Without it, this node has a record of no channel and refuses
# every claim at its edge as unknown.
#
# Fail-closed at STARTUP: the connector resolves token_address through the
# registry at contract_address and reads the token's own decimals(). A wrong
# RPC, a registry that does not answer, or a decimals mismatch is exit 1
# before it serves anything. Every chain below is one more endpoint this node
# must reach before it will boot.
#
# These values are the shared TOON devnet's deployment. Point them elsewhere
# only if you are running your own fleet end to end.
[settlement.evm]
rpc_url = "https://base-sepolia-rpc.publicnode.com"
contract_address = "0x8263BdD4eB4862395Cb4ef5dA5d637F4b047Eea1"
token_address = "0x49beE1Bca5d15Fb0963117923403F9498119a9Ce"
decimals = 6

# Deliberately NOT the [signer] key above. That one is per-box random material
# with no funds; this one is the identity clients open their channels AGAINST,
# so provision it from a seed you can reproduce, not from `openssl rand`. The
# TOON fleet derives it at NIP-06 m/44'/1237'/0'/0/0 — the NOSTR coin type,
# not the standard m/44'/60'. Deriving at m/44'/60' yields a valid address no
# channel was ever opened against; verify the derived address BEFORE the first
# `up -d`.
[settlement.evm.key]
key_file = "/app/data/settlement.key"

# A node that accepts claims is a counterparty on whichever chain the BUYER
# chose, so an EVM-only node refuses every Solana-paid write that reaches it.
# The devnet relay accepts both. Drop these two tables (and the key mount in
# docker-compose.yml) to run EVM-only.
[settlement.solana]
rpc_url = "https://api.devnet.solana.com"
program_id = "2aEVJ8koKD8LTZrLRSGtAtU7LBt4e7QjjCgf1kzQ7Rip"
token_address = "34eSxY7qxQ4GzyhDJ8GpUcTz1WWzruGbJbR8q6TtxfQU"
decimals = 6

[settlement.solana.key]
# A 32-byte ed25519 seed as 64 hex characters; the fleet derives it from the
# same mnemonic at m/44'/501'/0'/0'.
key_file = "/app/data/settlement-solana.key"

# ── (Optional) The operator surface ──────────────────────────────────────────
# Omitted here: it is off unless configured, and every read (peers, routes,
# channels, claims, /metrics) needs a bearer token while every write needs an
# RFC 9421 signature. Both are credentials, and this file is BAKED into a
# published image — so enable it by mounting the two file-valued forms
# (`bearer_token_file` / `write_keys_file`) and bind-mounting over this config
# rather than baking the values. A section with an empty token is a
# refuse-to-start, never a silently open surface.
